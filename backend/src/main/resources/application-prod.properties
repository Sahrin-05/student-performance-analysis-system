# ===================================================================
# Student Performance Analysis System (SPAS) - Production Configuration
# Active when SPRING_PROFILES_ACTIVE=prod
# ===================================================================

# Hibernate Validation (Schema must match migrations; no auto-DDL)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway active in production
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial baseline for existing database
spring.flyway.locations=classpath:db/migration

# Actuator Health Check (no internal server details exposed publicly)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# Production Logging
logging.level.root=INFO
logging.level.com.sahrin.spas=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
