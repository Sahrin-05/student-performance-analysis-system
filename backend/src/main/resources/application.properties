# ===================================================================
# Student Performance Analysis System (SPAS) - Backend Configuration
# ===================================================================

# Application Name & Server Port
spring.application.name=spas-backend
server.port=8080

# Persistent Local Configuration (Optional overrides; ignored by Git)
# Automatically imports .env or local.properties if present, enabling persistent configuration across terminal restarts.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:local.properties,optional:file:../local.properties,optional:classpath:application-local.properties

# PostgreSQL DataSource Configuration
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/spas_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA & Hibernate Configuration (Local Development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migration Configuration (Safe adoption for existing DB; clean install for new DB)
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Initial baseline for existing database
spring.flyway.locations=classpath:db/migration

# Initial Administrator Account Configuration (Optional Seed)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.identifier=${ADMIN_IDENTIFIER:ADMIN001}
app.admin.full-name=${ADMIN_FULL_NAME:System Administrator}

# JWT Authentication Configuration
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins Configuration (comma-separated origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Spring Boot Actuator Health & Metrics Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false
