# ===================================================================
# Student Performance Analysis System (SPAS) - Backend Configuration
# ===================================================================

# Application Name & Server Port
spring.application.name=spas-backend
server.port=8080

# PostgreSQL DataSource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/spas_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA & Hibernate Configuration (Local Development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
