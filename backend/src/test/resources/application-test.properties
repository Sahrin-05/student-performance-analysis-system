# Isolated In-Memory H2 Database Configuration for Integration Testing
spring.datasource.url=jdbc:h2:mem:spas_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test JWT Secret
app.jwt.secret=TestingSecretKeyForSpasApplicationJwtUnitAndIntegrationTestsOnly1234567890
app.jwt.expiration-ms=3600000
